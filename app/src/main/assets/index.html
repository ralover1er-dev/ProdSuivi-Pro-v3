      <p class="text-xs text-slate-600 mb-5 leading-relaxed font-medium">

      <!-- Formulaire de Licence Unique -->

            Clé de licence / Mot de passe
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="licence-input" 
              placeholder="Entrez le mot de passe d'activation" 
              class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-600 font-medium pr-10"
              autocomplete="current-password"
              required
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('licence-input', 'toggle-pwd-icon')" 
              class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600"
              title="Afficher/Masquer le mot de passe"
            >
              <i data-lucide="eye" id="toggle-pwd-icon" class="w-5 h-5"></i>
            </button>
          </div>

        </button>
      </form>

      <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
        <span>AUDRIAN Ronis</span>

      </div>

  <script>
    // ==========================================
    // LICENCE D'ACTIVATION UNIQUE OBLIGATOIRE

    const MOT_DE_PASSE_MAITRE = "Dianamavie1@";

    function verifierLicence() {
      const inputEl = document.getElementById("licence-input");
      const errEl = document.getElementById("license-error");
      const lockScreen = document.getElementById("lockScreen");
      if (!inputEl) return;

      const inputVal = inputEl.value.trim();
      if (btoa(inputVal) === btoa(MOT_DE_PASSE_MAITRE)) {
        localStorage.setItem('prodSuivi_activated', 'true');
        if (lockScreen) lockScreen.style.display = 'none';
        if (errEl) errEl.classList.add('hidden');
        showToast("Licence activée avec succès !");
      } else {
        if (errEl) {
          errEl.innerText = "Mot de passe incorrect";
          errEl.classList.remove('hidden');
        }
      }
    }

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        if (icon) icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function checkActivationOnLoad() {
      const lockScreen = document.getElementById("lockScreen");
      if (!lockScreen) return;
      if (localStorage.getItem('prodSuivi_activated') !== 'true') {
        lockScreen.style.display = 'flex';
      } else {
        lockScreen.style.display = 'none';
      }

      { id: "p18", name: "Feuilles de Manioc", mass: 2228.0, objectifKg: 1800.0, cartonWeight: 20.0, pcsPerCarton: 20, pcWeight: 1.0, desc: "Pilage fin pour Kwem traditionnel", sealed: true, weighings: [{ date: "05/10/2026", mass: 1114.0 }, { date: "05/10/2026", mass: 1114.0 }] },
      { id: "p19", name: "Ndjansang & Épices", mass: 2860.0, objectifKg: 2600.0, cartonWeight: 25.0, pcsPerCarton: 25, pcWeight: 1.0, desc: "Épices et graines nobles aromatiques", sealed: true, weighings: [{ date: "05/10/2026", mass: 1430.0 }, { date: "05/10/2026", mass: 1430.0 }] },
      { id: "p20", name: "Gingembre Frais & Aromates", mass: 500.0, objectifKg: 2000.0, cartonWeight: 20.0, pcsPerCarton: 20, pcWeight: 1.0, desc: "Gingembre noble sélection exportation", sealed: true, weighings: [{ date: "05/10/2026", mass: 250.0 }, { date: "05/10/2026", mass: 250.0 }] }
    ];

    const DEFAULT_USERS = [
      {
        id: "u-1",
        name: "AUDRIAN Ronis",
        phone: "670053957",
        password: "password123",
        role: "Superviseur Export Maritime",
        company: "COMACAM Agro-Logistique Export",
        createdAt: "01/10/2026"
      }
    ];

    const DEFAULT_CONTAINERS = [
      {
        id: "cnt-1",
        name: "COMACAM SUARL",
        client: "COMACAM SUARL International",
        destination: "Rungis - Paris, France",
        createdAt: "05/10/2026 11:09",
        closed: true,
        locked: true,
        producerPhone: "670053957",
        producerName: "AUDRIAN Ronis",
        products: INITIAL_PRODUCTS_V3
      }
    ];

    // State
    let appUsers = loadUsers();
    let currentAuthUser = loadCurrentAuthUser();
    let appContainers = loadContainers();
    let currentView = 'dashboard';
    let currentContainerId = null;
    let currentProductId = null;
    let containerSearchQuery = "";
    let productSearchQuery = "";
    let authMode = "login"; // 'login' or 'register'

    function loadUsers() {
      try {
        const s = localStorage.getItem("prodsuivi_users_v3");
        if (s) {
          const parsed = JSON.parse(s);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) { console.error(e); }
      return DEFAULT_USERS;
    }

    function saveUsers() {
      try { localStorage.setItem("prodsuivi_users_v3", JSON.stringify(appUsers)); } catch (e) {}
    }

    function loadCurrentAuthUser() {
      try {
        const s = localStorage.getItem("prodsuivi_current_user_v3");
        if (s) {
          const u = JSON.parse(s);
          if (u && u.phone) return u;
        }
      } catch (e) {}
      return DEFAULT_USERS[0];
    }

    function saveCurrentAuthUser(user) {
      currentAuthUser = user;
      try {
        if (user) localStorage.setItem("prodsuivi_current_user_v3", JSON.stringify(user));
        else localStorage.removeItem("prodsuivi_current_user_v3");
      } catch (e) {}
    }

    function loadContainers() {
      try {
        const s = localStorage.getItem("prodsuivi_containers_v3");
        if (s) {
          const parsed = JSON.parse(s);
          if (Array.isArray(parsed) && parsed.length > 0) {
            // Guarantee 20 items and 26.978 T if older 19 items stored
            if (parsed[0] && parsed[0].products && parsed[0].products.length === 19) {
              parsed[0].products = INITIAL_PRODUCTS_V3;
            }
            return parsed;
          }
        }
      } catch (e) {}
      return DEFAULT_CONTAINERS;
    }

    function saveContainers() {
      try { localStorage.setItem("prodsuivi_containers_v3", JSON.stringify(appContainers)); } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toast-message");
      if (toast && msgEl) {
        msgEl.innerText = msg;
        toast.classList.remove("opacity-0");
        toast.classList.add("opacity-100");
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 2500);
      }
    }

    function navigateTo(view, containerId = null, productId = null) {
      currentView = view;
      if (containerId !== null) currentContainerId = containerId;
      if (productId !== null) currentProductId = productId;

      ['dashboard', 'containers', 'profile'].forEach(id => {
        const btn = document.getElementById("nav-" + id);
        if (btn) {
          const isActive = (view === id) || ((view === 'container-detail' || view === 'product-detail') && id === 'containers');
          btn.className = `flex flex-col items-center py-2 ${isActive ? 'text-agro-800 font-bold' : 'text-slate-400'}`;
        }
      });

      renderCurrentView();
      window.scrollTo(0, 0);
    }

    function getContainerStats(container) {
      if (!container || !container.products) return { totalKg: 0, totalTonnes: 0, totalObjKg: 0, totalCartons: 0, itemsCount: 0, fillRate: 0 };
      let totalKg = 0;
      let totalObjKg = 0;
      let totalCartons = 0;

      container.products.forEach(p => {
        const pMass = parseFloat(p.mass) || 0;
        const pObj = parseFloat(p.objectifKg) || pMass || 1;
        const pCtnW = parseFloat(p.cartonWeight) || 1;
        totalKg += pMass;
        totalObjKg += pObj;
        totalCartons += (pMass / pCtnW);
      });

      const fillRate = totalObjKg > 0 ? (totalKg / totalObjKg) * 100 : 0;
      return {
        totalKg,
        totalTonnes: totalKg / 1000.0,
        totalObjKg,
        totalObjTonnes: totalObjKg / 1000.0,
        totalCartons,
        itemsCount: container.products.length,
        fillRate
      };
    }

    function renderCurrentView() {
      const el = document.getElementById("app-container");
      const bottomNav = document.getElementById("bottom-nav");
      if (!el) return;

      // If user is not logged in, show Auth Screen
      if (!currentAuthUser) {
        if (bottomNav) bottomNav.classList.add("hidden");
        renderAuthScreen(el);
        lucide.createIcons();
        return;
      }

      if (bottomNav) bottomNav.classList.remove("hidden");
      if (currentView === 'dashboard') renderDashboard(el);
      else if (currentView === 'containers') renderContainerList(el);
      else if (currentView === 'container-detail') renderContainerDetail(el);
      else if (currentView === 'product-detail') renderProductDetail(el);
      else if (currentView === 'profile') renderProfile(el);
      lucide.createIcons();
    }

    // ==========================================
    // AUTHENTICATION SCREEN: LOGIN & REGISTER
    // ==========================================
    function renderAuthScreen(host) {
      host.innerHTML = `
        <div class="px-5 py-8 space-y-6">
          <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-agro-800 to-agro-600 text-white flex items-center justify-center mx-auto shadow-lg shadow-agro-800/20 border-2 border-white">
              <i data-lucide="container" class="w-8 h-8 text-agro-200"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">ProdSuivi PRO <span class="text-agro-700">V3</span></h2>
            <p class="text-xs text-slate-500 max-w-xs mx-auto">Plateforme de Suivi Agro-Logistique Alimentaire & Traçabilité Export Maritime</p>
          </div>

          <!-- Auth Tabs -->
          <div class="bg-slate-200 p-1 rounded-2xl grid grid-cols-2 text-xs font-bold">
            <button onclick="authMode = 'login'; renderCurrentView();" class="py-2.5 rounded-xl transition-all ${authMode === 'login' ? 'bg-white text-agro-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}">
              Connexion
            </button>
            <button onclick="authMode = 'register'; renderCurrentView();" class="py-2.5 rounded-xl transition-all ${authMode === 'register' ? 'bg-white text-agro-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}">
              Créer un compte
            </button>
          </div>

          <!-- Auth Forms -->
          <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-md">
            ${authMode === 'login' ? `

    function handleLogin(e) {
      e.preventDefault();
      const phone = document.getElementById("login-phone").value.trim();
      const pass = document.getElementById("login-password").value.trim();

      const user = appUsers.find(u => u.phone === phone);
      if (!user) {
        alert("Aucun compte trouvé pour ce numéro de téléphone. Veuillez créer un compte.");
        return;
      }
      if (user.password !== pass) {
        alert("Mot de passe incorrect.");
        return;
      }

      saveCurrentAuthUser(user);
      showToast(`Bienvenue, ${user.name}`);
      navigateTo('dashboard');
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById("reg-name").value.trim();
      const phone = document.getElementById("reg-phone").value.trim();
      const pass = document.getElementById("reg-password").value.trim();

      if (!name || !phone || !pass) return;

      const existing = appUsers.find(u => u.phone === phone);
      if (existing) {
        alert("Un compte existe déjà avec ce numéro de téléphone. Veuillez vous connecter.");
        authMode = 'login';
        renderCurrentView();
        return;
      }

      const now = new Date();
      const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;

      const newUser = {
        id: "u-" + Date.now(),
        name,
        phone,
        password: pass,
        role: "Superviseur Export Maritime",
        company: "Agro-Export Douala",
        createdAt: dateStr
      };

      appUsers.push(newUser);
      saveUsers();
      saveCurrentAuthUser(newUser);

      showToast(`Compte créé avec succès ! Bienvenue ${name}`);
      navigateTo('dashboard');
    }

    function renderContainerDetail(host) {

      if (!container) { navigateTo('containers'); return; }

      const stats = getContainerStats(container);

      let productsWithProg = container.products.map(p => {
        const mass = parseFloat(p.mass) || 0;
        const obj = parseFloat(p.objectifKg) || mass || 1;
        const ctnW = parseFloat(p.cartonWeight) || 1;
        const cartons = mass / ctnW;
        const progression = obj > 0 ? (mass / obj) * 100 : 0;
        const isCompleted = mass >= obj;
        return { ...p, mass, obj, ctnW, cartons, progression, isCompleted };
      });

      if (productSearchQuery.trim()) {
        const q = productSearchQuery.toLowerCase();
        productsWithProg = productsWithProg.filter(p => p.name.toLowerCase().includes(q));
      }

      // Tri automatique : non terminés en haut, terminés (verts) en bas
      productsWithProg.sort((a, b) => {
        if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
        return a.progression - b.progression;

    function deleteProduct(containerId, productId) {
      const container = appContainers.find(c => c.id === containerId);
      if (!container) return;
      if (container.closed) { showToast("Conteneur clôturé"); return; }
      const prod = container.products.find(p => p.id === productId);
      if (prod && confirm(`Supprimer le produit "${prod.name}" ?`)) {
        container.products = container.products.filter(p => p.id !== productId);
        saveContainers();
        showToast("Produit supprimé");
        renderCurrentView();
      }
    }

    function addWeighing(containerId, productId) {
      const container = appContainers.find(c => c.id === containerId);
      if (!container || container.closed) { showToast("Conteneur clôturé"); return; }
      const product = container.products.find(p => p.id === productId);
      if (!product) return;

      const dateEl = document.getElementById("new-weighing-date");
      const massEl = document.getElementById("new-weighing-mass");
      const val = parseFloat(massEl ? massEl.value : 0);
      if (!val || val <= 0) { alert("Veuillez saisir une masse valide."); return; }

      const dateStr = dateEl && dateEl.value ? formatDateDisplay(dateEl.value) : "05/10/2026";
      if (!product.weighings) product.weighings = [];
      product.weighings.push({ date: dateStr, mass: val });

      product.mass = product.weighings.reduce((acc, w) => acc + (parseFloat(w.mass) || 0), 0);
      saveContainers();
      showToast(`Pesée de ${val.toFixed(1)} Kg enregistrée !`);
      renderCurrentView();
    }

    function editWeighing(cid, pid, idx) {
      const c = appContainers.find(x => x.id === cid);
      if (c && c.closed) { showToast("Dossier clôturé"); return; }
      const p = c.products.find(x => x.id === pid);
      const cur = p.weighings[idx];
      const res = prompt(`Modifier la pesée #${idx + 1} (en Kg):`, cur.mass);
      if (res !== null) {
        const val = parseFloat(res);
        if (!isNaN(val) && val > 0) {
          cur.mass = val;
          p.mass = p.weighings.reduce((acc, w) => acc + (parseFloat(w.mass) || 0), 0);
          saveContainers();
          showToast("Pesée mise à jour");
          renderCurrentView();
        }
      }
    }

    function deleteWeighing(cid, pid, idx) {
      const c = appContainers.find(x => x.id === cid);
      if (c && c.closed) { showToast("Dossier clôturé"); return; }
      const p = c.products.find(x => x.id === pid);
      if (confirm(`Supprimer la pesée #${idx + 1} ?`)) {
        p.weighings.splice(idx, 1);
        p.mass = p.weighings.reduce((acc, w) => acc + (parseFloat(w.mass) || 0), 0);
        saveContainers();
        showToast("Pesée supprimée");
        renderCurrentView();
      }
    }

              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              <span>Réinitialiser aux 20 aliments COMACAM SUARL</span>
            </button>
            <button onclick="handleLogout()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-2xl text-xs flex items-center justify-center space-x-2 shadow-md">
              <i data-lucide="log-out" class="w-4 h-4"></i>
              <span>Se déconnecter de la session</span>
            </button>
          </div>
        </div>
      `;
    }

    function resetData() {
      if (confirm("Réinitialiser les conteneurs aux 20 aliments originaux COMACAM SUARL (26.978 T) ?")) {
        appContainers = JSON.parse(JSON.stringify(DEFAULT_CONTAINERS));
        saveContainers();
        showToast("Données 20 aliments réinitialisées");
        renderCurrentView();
      }
    }

    // ==========================================
    // 6. RAPPORT PDF PROFESSIONNEL V3
    // ==========================================
    function generateContainerPDF_V3(containerId) {
      const container = appContainers.find(c => c.id === containerId);
      if (!container) return;

      if (window.AndroidBridge && typeof window.AndroidBridge.generatePdf === 'function') {
        window.AndroidBridge.generatePdf(JSON.stringify(container));
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

      let totalKg = 0;
      let totalObjKg = 0;
      let totalCartons = 0;

      const tableRows = container.products.map((p, index) => {
        const pMass = parseFloat(p.mass) || 0;
        const pObj = parseFloat(p.objectifKg) || pMass || 1;
        const pCtnW = parseFloat(p.cartonWeight) || 1;
        const pCartons = pMass / pCtnW;
        const ecart = pMass - pObj;
        const sign = ecart >= 0 ? "+" : "";

        totalKg += pMass;
        totalObjKg += pObj;
        totalCartons += pCartons;

        const isAtteint = pMass >= pObj;
        const statusLabel = isAtteint ? "ATTEINT" : `EN COURS (${((pMass / pObj) * 100).toFixed(0)}%)`;

        return [
          index + 1,
          p.name,
          pCtnW.toFixed(1) + " kg",
          pObj.toFixed(1) + " Kg",
          pMass.toFixed(1) + " Kg",
          sign + ecart.toFixed(1) + " Kg",
          pCartons.toFixed(1) + " ctn",
          statusLabel
        ];
      });

      const totalTonnes = totalKg / 1000.0;
      const totalObjTonnes = totalObjKg / 1000.0;
      const fillRate = totalObjKg > 0 ? (totalKg / totalObjKg) * 100 : 0;

      // Header Banner
      doc.setFillColor(22, 101, 52);
      doc.rect(0, 0, 210, 36, "F");

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.setFont("helvetica", "bold");
      doc.text("RAPPORT DE CONTENEUR ALIMENTAIRE", 14, 16);

      doc.setFontSize(9.5);
      doc.setFont("helvetica", "normal");
      doc.text("ProdSuivi PRO V3 - Agro-Logistique Alimentaire Cameroun", 14, 23);
      doc.text("Suivi de Production & Objectifs d'Exportation Maritime", 14, 29);

      if (container.closed) {
        doc.setFillColor(185, 28, 28);
        doc.roundedRect(150, 10, 46, 12, 2, 2, "F");
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.text("STATUT: CLÔTURÉ", 153, 18);
      } else {
        doc.setFillColor(21, 128, 61);
        doc.roundedRect(150, 10, 46, 12, 2, 2, "F");
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.text("STATUT: OUVERT", 155, 18);
      }

      doc.setTextColor(30, 41, 59);
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text("FICHE EXPÉDITION CONTENEUR", 14, 45);

      doc.setDrawColor(226, 232, 240);
      doc.line(14, 47, 196, 47);

      doc.setFontSize(8.5);
      doc.setFont("helvetica", "normal");
      doc.text("Nom du Conteneur :", 14, 53);
      doc.setFont("helvetica", "bold");
      doc.text(`${container.name}`, 50, 53);

      doc.setFont("helvetica", "normal");
      doc.text("Producteur / Resp. :", 14, 59);
      doc.setFont("helvetica", "bold");
      doc.text(`${container.producerName || currentAuthUser?.name || 'AUDRIAN Ronis'} (${container.producerPhone || currentAuthUser?.phone || '670053957'})`, 50, 59);

      doc.setFont("helvetica", "normal");
      doc.text("Tonnage Objectif Global :", 110, 53);
      doc.setFont("helvetica", "bold");
      doc.text(`${totalObjKg.toFixed(1)} Kg (${totalObjTonnes.toFixed(3)} T)`, 152, 53);

      doc.setFont("helvetica", "normal");
      doc.text("Tonnage Réalisé :", 110, 59);
      doc.setFont("helvetica", "bold");
      doc.text(`${totalKg.toFixed(1)} Kg (${totalTonnes.toFixed(3)} T)`, 152, 59);

      doc.setFillColor(240, 253, 244);
      doc.setDrawColor(187, 247, 208);
      doc.roundedRect(14, 65, 182, 16, 2, 2, "FD");

      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(22, 101, 52);
      doc.text(`TOTAL OBJECTIF: ${totalObjKg.toFixed(0)} Kg   |   TOTAL RÉALISÉ: ${totalKg.toFixed(1)} Kg   |   TAUX: ${fillRate.toFixed(1)}%   |   CARTONS: ${totalCartons.toFixed(1)}`, 18, 75);

      doc.autoTable({
        startY: 85,
        head: [["#", "Produit", "Poids Carton", "Objectif (Kg)", "Réalisé (Kg)", "Écart", "Est. Cartons", "Statut"]],
        body: tableRows,
        foot: [
          ["", "TOTAUX CONTENEUR", "", `${totalObjKg.toFixed(1)} Kg`, `${totalKg.toFixed(1)} Kg`, `${(totalKg - totalObjKg) >= 0 ? '+' : ''}${(totalKg - totalObjKg).toFixed(1)} Kg`, `${totalCartons.toFixed(1)} Ctn`, `${fillRate.toFixed(1)}%`]
        ],
        theme: "striped",
        headStyles: { fillColor: [22, 101, 52], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8, halign: "center" },
        footStyles: { fillColor: [22, 101, 52], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8, halign: "center" },
        columnStyles: {
          0: { cellWidth: 8, halign: "center" },
          1: { cellWidth: 46, fontStyle: "bold" },
          2: { cellWidth: 20, halign: "center" },
          3: { cellWidth: 24, halign: "right", fontStyle: "bold" },
          4: { cellWidth: 24, halign: "right", fontStyle: "bold" },
          5: { cellWidth: 20, halign: "right" },
          6: { cellWidth: 20, halign: "right", fontStyle: "bold" },
          7: { cellWidth: 20, halign: "center" }
        },
        styles: { fontSize: 7.5, cellPadding: 2 },
        alternateRowStyles: { fillColor: [248, 250, 252] }
      });

      const finalY = doc.lastAutoTable.finalY + 8;
      if (finalY < 270) {
        doc.setFontSize(7.5);
        doc.setFont("helvetica", "italic");
        doc.setTextColor(100, 116, 139);
        doc.text(`Document certifié avec concordance exacte des pesées (${container.products.length} éléments). Mention: ProdSuivi PRO V3`, 14, finalY);

        doc.setDrawColor(203, 213, 225);
        doc.roundedRect(14, finalY + 5, 80, 18, 1, 1, "D");
        doc.text("Visa Superviseur Chargement", 18, finalY + 10);

        doc.roundedRect(116, finalY + 5, 80, 18, 1, 1, "D");
        doc.text("Cachet Phyto-Sanitaire Port de Douala", 120, finalY + 10);
      }

      openPdfPreviewModal_V3(doc, container, totalKg, totalObjKg, totalCartons, fillRate);
    }

    function openPdfPreviewModal_V3(doc, container, totalKg, totalObjKg, totalCartons, fillRate) {
      const filename = `Rapport_Conteneur_V3_${container.name.replace(/\s+/g, '_')}_${Date.now()}.pdf`;
      const pdfBlob = doc.output("blob");
      const pdfBlobUrl = URL.createObjectURL(pdfBlob);

      const modalBox = document.getElementById("modal-box");
      const backdrop = document.getElementById("modal-backdrop");
      if (!modalBox || !backdrop) return;

      modalBox.innerHTML = `
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-xl bg-agro-100 text-agro-800 flex items-center justify-center">
              <i data-lucide="file-check-2" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="font-extrabold text-sm text-slate-900">Rapport PDF V3 Généré</h3>
              <p class="text-[11px] text-slate-400">${container.products.length} éléments • Objectif: ${totalObjKg.toFixed(0)} Kg • Réalisé: ${totalKg.toFixed(1)} Kg (${fillRate.toFixed(1)}%)</p>
            </div>
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="p-5 space-y-4">
          <div class="bg-emerald-50 rounded-2xl p-4 border border-emerald-100 text-xs text-emerald-800 space-y-1">
            <div class="font-bold flex items-center space-x-1.5">
              <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i>
              <span>Tableau complet 100% concordant</span>
            </div>
            <p class="text-[11px] text-emerald-700">
              Total Objectif: <strong>${totalObjKg.toFixed(0)} Kg</strong> | Réalisé: <strong>${totalKg.toFixed(1)} Kg</strong> | Taux: <strong>${fillRate.toFixed(1)}%</strong> | Cartons: <strong>${totalCartons.toFixed(1)}</strong>
            </p>
          </div>

          <div class="space-y-2">
            <button id="btn-dl-pdf" class="w-full bg-agro-800 hover:bg-agro-900 active:scale-95 text-white font-bold py-3.5 rounded-2xl text-xs flex items-center justify-center space-x-2 shadow-md">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>Télécharger le Rapport PDF</span>
            </button>
            <button id="btn-share-pdf" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 rounded-2xl text-xs flex items-center justify-center space-x-2">
              <i data-lucide="share-2" class="w-4 h-4"></i>
              <span>Partager le fichier PDF</span>
            </button>
            <a href="${pdfBlobUrl}" target="_blank" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-2.5 rounded-2xl text-xs flex items-center justify-center space-x-2">
              <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              <span>Aperçu plein écran</span>
            </a>
          </div>
        </div>
      `;

      backdrop.classList.remove("hidden");
      lucide.createIcons();

      document.getElementById("btn-dl-pdf").onclick = () => {
        if (window.AndroidBridge && typeof window.AndroidBridge.generatePdf === 'function') {
          window.AndroidBridge.generatePdf(JSON.stringify(container));
          closeModal();
          return;
        }
        doc.save(filename);
        showToast("Téléchargement lancé");
        closeModal();
      };

      document.getElementById("btn-share-pdf").onclick = async () => {
        if (navigator.share) {
          try {
            const f = new File([pdfBlob], filename, { type: "application/pdf" });
            await navigator.share({ title: `Rapport ${container.name}`, files: [f] });
            showToast("Partagé !");
            closeModal();
          } catch (e) { doc.save(filename); }
        } else {
          doc.save(filename);
          showToast("PDF téléchargé");
          closeModal();
        }
      };
    }

    // ==========================================
    // MODALS: New Container & Add/Edit Product V3
    // ==========================================
    function openNewContainerModal() {
      const modalBox = document.getElementById("modal-box");
      const backdrop = document.getElementById("modal-backdrop");
      if (!modalBox || !backdrop) return;

      modalBox.innerHTML = `
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
          <h3 class="font-extrabold text-base text-slate-900">Nouveau Conteneur</h3>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="handleCreateContainer(event)" class="p-5 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nom du Conteneur *</label>
            <input type="text" id="new-container-name" required placeholder="Ex: Conteneur Mr Sango" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Client / Destinataire</label>
            <input type="text" id="new-container-client" placeholder="Ex: Sango Import & Export" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs" />
          </div>
          <div class="flex items-center space-x-2 pt-2">
            <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 text-slate-700 font-bold py-3 rounded-xl text-xs">Annuler</button>
            <button type="submit" class="w-1/2 bg-agro-800 text-white font-bold py-3 rounded-xl text-xs shadow-md">Créer</button>
          </div>
        </form>
      `;

      backdrop.classList.remove("hidden");
      lucide.createIcons();
    }

    function handleCreateContainer(e) {
      e.preventDefault();
      const name = document.getElementById("new-container-name").value.trim();
      const client = document.getElementById("new-container-client").value.trim();
      if (!name) return;

      const newId = "cnt-" + Date.now();
      const now = new Date();
      const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      appContainers.push({
        id: newId,
        name,
        client: client || name,
        destination: "Le Havre / Rungis (France)",
        createdAt: dateStr,
        closed: false,
        locked: false,
        producerPhone: currentAuthUser?.phone || "670053957",
        producerName: currentAuthUser?.name || "AUDRIAN Ronis",
        products: []
      });

      saveContainers();
      closeModal();
      showToast(`Conteneur "${name}" créé`);
      navigateTo('container-detail', newId);
    }

    function openAddProductModal(containerId) {
      const c = appContainers.find(x => x.id === containerId);
      if (c && c.closed) { showToast("Conteneur clôturé"); return; }
      openProductFormModal_V3(containerId, null);
    }

    function openEditProductModal(containerId, productId) {
      const c = appContainers.find(x => x.id === containerId);
      if (c && c.closed) { showToast("Conteneur clôturé"); return; }
      openProductFormModal_V3(containerId, productId);
    }

    function openProductFormModal_V3(containerId, productId) {
      const container = appContainers.find(c => c.id === containerId);
      if (!container) return;

      const product = productId ? container.products.find(p => p.id === productId) : null;
      const isEdit = !!product;

      const modalBox = document.getElementById("modal-box");
      const backdrop = document.getElementById("modal-backdrop");
      if (!modalBox || !backdrop) return;

      modalBox.innerHTML = `
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
          <h3 class="font-extrabold text-base text-slate-900">${isEdit ? 'Modifier le Produit' : 'Ajouter un Produit (V3)'}</h3>
          <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <form onsubmit="handleSaveProduct_V3(event, '${containerId}', '${productId || ''}')" class="p-5 space-y-3.5 overflow-y-auto max-h-[75vh]">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nom du Produit (Ex: Ndolé, Bitter Leaves) *</label>
            <input type="text" id="prod-v3-name" required value="${isEdit ? escapeHtml(product.name) : ''}" placeholder="Ex: Ndolé, Bitter Leaves, Bobolo..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 font-semibold" />
          </div>

          <div class="bg-emerald-50/80 p-3 rounded-2xl border border-emerald-200 space-y-1">
            <label class="block text-xs font-extrabold text-emerald-900 uppercase">
              🎯 Tonnage de Départ / Objectif (Kg) *
            </label>
            <div class="text-[11px] text-emerald-700 font-medium">Quantité totale commandée par le client pour ce produit</div>
            <input 
              type="number" 
              id="prod-v3-objectif" 
              step="0.1" 
              required
              value="${isEdit ? (product.objectifKg || product.mass || 1500) : 1500}"
              placeholder="Ex: 1500.0" 
              class="w-full bg-white border border-emerald-300 rounded-xl p-2.5 text-xs text-slate-900 font-black focus:ring-2 focus:ring-emerald-500 mt-1" 
            />
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Poids pièce (Kg) *</label>
              <input type="number" id="prod-v3-pc-weight" step="0.1" required value="${isEdit ? product.pcWeight : 1.0}" oninput="calcCartonWeightV3()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs" />
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Qté / ctn *</label>
              <input type="number" id="prod-v3-pcs" required value="${isEdit ? product.pcsPerCarton : 15}" oninput="calcCartonWeightV3()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs" />
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-700 uppercase mb-1">Poids carton (Kg) *</label>
              <input type="number" id="prod-v3-carton-weight" step="0.1" required value="${isEdit ? product.cartonWeight : 15.0}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-agro-800" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Masse actuelle / Réalisée (Kg) *</label>
            <input type="number" id="prod-v3-mass" step="0.1" required value="${isEdit ? product.mass : 0}" placeholder="ex: 1540.0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Description (Facultatif)</label>
            <input type="text" id="prod-v3-desc" value="${isEdit ? escapeHtml(product.desc || '') : ''}" placeholder="Ex: Feuilles fraîches sous vide" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs" />
          </div>

          <div class="flex items-center space-x-2 pt-3">
            <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 text-slate-700 font-bold py-3 rounded-xl text-xs">Annuler</button>
            <button type="submit" class="w-1/2 bg-agro-800 text-white font-bold py-3 rounded-xl text-xs shadow-md">Enregistrer</button>
          </div>
        </form>
      `;

      backdrop.classList.remove("hidden");
      lucide.createIcons();
    }

    function calcCartonWeightV3() {
      const pw = parseFloat(document.getElementById("prod-v3-pc-weight")?.value) || 0;
      const pcs = parseFloat(document.getElementById("prod-v3-pcs")?.value) || 0;
      const cw = document.getElementById("prod-v3-carton-weight");
      if (cw && pw > 0 && pcs > 0) cw.value = (pw * pcs).toFixed(1);
    }

    function handleSaveProduct_V3(e, containerId, productId) {
      e.preventDefault();
      const container = appContainers.find(c => c.id === containerId);
      if (!container) return;

      const name = document.getElementById("prod-v3-name").value.trim();
      const objectifKg = parseFloat(document.getElementById("prod-v3-objectif").value) || 1000.0;
      const pcWeight = parseFloat(document.getElementById("prod-v3-pc-weight").value) || 1.0;
      const pcsPerCarton = parseInt(document.getElementById("prod-v3-pcs").value) || 15;
      const cartonWeight = parseFloat(document.getElementById("prod-v3-carton-weight").value) || (pcWeight * pcsPerCarton);
      const mass = parseFloat(document.getElementById("prod-v3-mass").value) || 0;
      const desc = document.getElementById("prod-v3-desc").value.trim();

      if (!name) return;

      if (productId) {
        const p = container.products.find(x => x.id === productId);
        if (p) {
          p.name = name;
          p.objectifKg = objectifKg;
          p.pcWeight = pcWeight;
          p.pcsPerCarton = pcsPerCarton;
          p.cartonWeight = cartonWeight;
          p.mass = mass;
          p.desc = desc;
          if (!p.weighings || p.weighings.length === 0) p.weighings = [{ date: "05/10/2026", mass }];
        }
        showToast(`Produit "${name}" mis à jour`);
      } else {
        container.products.push({
          id: "p-" + Date.now(),
          name,
          objectifKg,
          pcWeight,
          pcsPerCarton,
          cartonWeight,
          mass,
          desc,
          sealed: true,
          weighings: [{ date: "05/10/2026", mass }]
        });
        showToast(`Produit "${name}" ajouté avec objectif ${objectifKg.toFixed(0)} Kg`);
      }

      saveContainers();
      closeModal();
      renderCurrentView();
    }

    function closeModal() {
      const b = document.getElementById("modal-backdrop");
      if (b) b.classList.add("hidden");
    }

    function escapeHtml(t) {
      if (!t) return "";
      return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function formatDateDisplay(d) {
      if (!d) return "05/10/2026";
      const p = d.split("-");
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
    }

    document.getElementById("modal-backdrop")?.addEventListener("click", function(e) {
      if (e.target === this) closeModal();
    });

    window.addEventListener("DOMContentLoaded", () => {
      // 1. Activation License Check (Obligatoire)
      checkActivationOnLoad();
      // 2. Render view
      renderCurrentView();
    });
  </script>
</body>
