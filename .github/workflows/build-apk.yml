name: Build ProdSuivi PRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Android project from your HTML
        run: |
          ls -la
          echo '{"name":"prod-suivi","type":"module"}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ProdSuivi PRO V3" "com.comacam.prodsuivi.v3" --web-dir="." --npm-client npm || true
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProdSuivi-PRO-V3-APK-Dianamavie
          path: android/app/build/outputs/apk/debug/*.apk
