name: Build ProdSuivi PRO APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy web assets to APK
        run: |
          mkdir -p app/src/main/assets/public
          cp -f index.html app/src/main/assets/public/index.html
          echo "INDEX COPIE OK"
          ls -lh app/src/main/assets/public/
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Create debug.keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Debug, O=Debug, C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
      - name: Build APK Debug
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ProdSuivi-PRO-V3-Debug
          path: app/build/outputs/apk/debug/*.apk
