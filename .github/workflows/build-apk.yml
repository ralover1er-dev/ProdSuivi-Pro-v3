name: Build ProdSuivi PRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps
        run: |
          npm install
          npx cap copy android || true
          mkdir -p app/src/main/assets/public
          cp -f index.html app/src/main/assets/public/index.html || true
          cp -f index.html app/src/main/assets/public/ || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create debug.keystore and patch gradle.properties
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "android.disableAutomaticComponentCreation=true" >> gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" >> gradle.properties

      - name: Setup Gradle wrapper and build APK Debug
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon -Djava.awt.headless=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProdSuivi-PRO-V3-Debug
          path: app/build/outputs/apk/debug/*.apk
